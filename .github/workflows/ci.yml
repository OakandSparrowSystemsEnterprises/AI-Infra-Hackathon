name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oasse-ai-infra-hackathon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: oasse-ai-infra-hackathon/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Source and submission hygiene
        run: |
          git diff --check HEAD^
          python scripts/check_greenfield.py
          python scripts/check_submission_draft.py
          python -m compileall -q src scripts
          python -m pip check
      - name: Test
        run: python -m pytest tests -q
      - name: Demo smoke test
        run: python scripts/run_demo.py
      - name: Docker build
        run: docker build -t oasse-physical-ai-smoke .
      - name: HTTP service smoke test
        run: |
          set -euo pipefail
          docker run -d --name oasse-smoke -p 127.0.0.1:8000:8000 oasse-physical-ai-smoke
          trap 'docker logs oasse-smoke || true; docker rm -f oasse-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          base = 'http://127.0.0.1:8000'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method)
              with urllib.request.urlopen(req, timeout=5) as response:
                  return json.load(response)
          for attempt in range(30):
              try:
                  health = request('/health')
                  break
              except OSError:
                  if attempt == 29: raise
                  time.sleep(1)
          assert health['status'] == 'ok'
          assert health['authority_mode'] == 'reference'
          for name, verdict, executed in [('allow','ALLOW',True), ('stale','HOLD',False), ('occupied','DENY',False), ('overspeed','TRANSFORM',True)]:
              result = request('/v1/demo/' + name, 'POST')
              assert result['decision']['verdict'] == verdict, result
              assert result['executed'] is executed, result
              assert result['dispatch_attempted'] is executed, result
          assert request('/v1/receipts')['valid'] is True
          assert request('/v1/metrics')['runs'] == 4
          print('Docker HTTP smoke passed: ALLOW, HOLD, DENY, TRANSFORM, receipts, metrics')
          PY
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oasse-ai-infra-hackathon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: oasse-ai-infra-hackathon/pyproject.toml
      - name: Install native simulation dependencies
        run: python -m pip install -e ".[dev,simulator]"
      - name: Require actual MuJoCo import
        run: python -c "import mujoco; print('Native MuJoCo', mujoco.__version__)"
      - name: Complete suite with native dynamics
        run: python -m pytest tests -q
      - name: Native simulator smoke test
        run: python scripts/run_mujoco_demo.py --output "$RUNNER_TEMP/mujoco-smoke.json"
      - name: Record dependency versions
        run: python -m pip freeze > "$RUNNER_TEMP/simulator-dependencies.txt"
      - name: Save native verification record
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-verification
          path: |
            ${{ runner.temp }}/mujoco-smoke.json
            ${{ runner.temp }}/simulator-dependencies.txt
          if-no-files-found: error
          retention-days: 14
  native-perception:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: osmesa
      OASSE_NATIVE_CAMERA_TESTS: "1"
    defaults:
      run:
        working-directory: oasse-ai-infra-hackathon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: oasse-ai-infra-hackathon/pyproject.toml
      - name: Install headless rendering
        run: sudo apt-get update -qq && sudo apt-get install -y libosmesa6
      - name: Install native inference and physics
        run: python -m pip install -e ".[dev,simulator,perception]"
      - name: Require native runtimes and valid dependencies
        run: |
          python -c "import openvino, mujoco; print('OpenVINO', openvino.__version__, 'MuJoCo', mujoco.__version__)"
          python -m pip check
      - name: Full native suite
        run: python -m pytest tests -q --junitxml="$RUNNER_TEMP/native-tests.xml"
      - name: Native vision to physics smoke test
        run: python scripts/run_native_vision_demo.py --output "$RUNNER_TEMP/native-vision.json" --artifacts-dir "$RUNNER_TEMP/vision-artifacts"
      - name: Record tested versions
        run: python -m pip freeze > "$RUNNER_TEMP/native-dependencies.txt"
      - name: Save native perception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-perception-verification
          path: |
            ${{ runner.temp }}/native-tests.xml
            ${{ runner.temp }}/native-vision.json
            ${{ runner.temp }}/native-dependencies.txt
            ${{ runner.temp }}/vision-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Full submission rehearsal
        run: python scripts/rehearse_submission.py --profile native --output "$RUNNER_TEMP/submission-rehearsal"
      - name: Save inspection and submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-rehearsal
          path: ${{ runner.temp }}/submission-rehearsal
          if-no-files-found: error
          retention-days: 14
