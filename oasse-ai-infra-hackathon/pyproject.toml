[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oasse-physical-ai-authority"
version = "0.4.0"
description = "Hackathon integration for Gatekeeper pre-execution authority in Physical AI"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.26,<3"]
simulator = ["mujoco>=3.3,<4", "numpy>=1.26,<3"]
perception = ["openvino>=2025.0,<2027", "numpy>=1.26,<3"]

camera = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
